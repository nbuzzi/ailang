[workspace]
resolver = "2"
members = [
    "crates/ailang-core",
    "crates/ailang-lexer",
    "crates/ailang-parser",
    "crates/ailang-eval",
    "crates/ailang-stdlib",
    "crates/ailang-mcp",
    "crates/ailang-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["nbuzzi"]
license = "MIT"
repository = "https://github.com/nbuzzi/ailang"

[workspace.dependencies]
# Internal crates
ailang-core   = { path = "crates/ailang-core" }
ailang-lexer  = { path = "crates/ailang-lexer" }
ailang-parser = { path = "crates/ailang-parser" }
ailang-eval   = { path = "crates/ailang-eval" }
ailang-stdlib = { path = "crates/ailang-stdlib" }
ailang-mcp    = { path = "crates/ailang-mcp" }

# Lexer
logos = "0.15"

# Serialization (preserve_order keeps object keys in insertion order => deterministic output)
serde       = { version = "1", features = ["derive"] }
serde_json  = { version = "1", features = ["preserve_order"] }
serde_yaml  = "0.9"
indexmap    = { version = "2", features = ["serde"] }

# File system
walkdir  = "2"
globset  = "0.4"
tempfile = "3"

# Text / regex
regex = "1"

# CSV
csv = "1"

# HTTP
reqwest = { version = "0.12", features = ["blocking", "json", "stream"] }
tokio   = { version = "1", features = ["full"] }

# Hashing
sha2   = "0.10"
md-5   = "0.10"
base64 = "0.22"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "1"
